<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Fiber - Management Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar { height: 100vh; background-color: #1e293b; color: white; padding: 20px; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: block; padding: 10px 0; }
        .sidebar a:hover { color: #38bdf8; }
        .brand-logo { font-weight: bold; font-size: 1.5rem; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <div class="brand-logo mb-4">🌐 Next Fiber</div>
                <a href="/">📊 Dashboard</a>
                <a href="/add">➕ Add Customer</a>
            </div>
            <div class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
